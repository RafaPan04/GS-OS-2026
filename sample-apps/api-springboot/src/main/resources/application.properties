spring.application.name=colecity-api
server.port=${SERVER_PORT:8080}

# Vem de /etc/citizentech/api.env (EnvironmentFile= do systemd)
app.message=${APP_MESSAGE:Ola da API Colecity}

# Healthcheck usado pelo deploy-api.sh
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

# Mostra a mensagem de erro (ex.: "informe seu nome") na resposta 400
server.error.include-message=always
