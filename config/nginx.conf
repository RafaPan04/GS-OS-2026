# =============================================================================
# nginx do container "app" (substitui o /etc/nginx/nginx.conf padrão)
#  - entrega o front React (arquivos estáticos)
#  - repassa /api/ para o container "api" (Spring Boot na porta 8080)
# =============================================================================
user nginx;
worker_processes auto;
pid /run/nginx.pid;
error_log /var/log/citizentech/nginx-error.log;

events {
    worker_connections 1024;
}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log   /var/log/citizentech/nginx-access.log;

    server {
        listen 80;
        server_name _;

        root  /opt/citizentech/www;
        index index.html;

        # DNS interno do Docker. Com o endereço numa variável, o nginx procura
        # o IP da API a cada requisição: ele sobe mesmo se a API estiver fora.
        resolver 127.0.0.11 valid=10s;
        set $api http://api.citizentech.internal:8080;

        # O navegador chama /api/... no próprio front; o nginx repassa para a API
        location /api/ {
            proxy_pass $api;
        }

        # Qualquer outra rota é do React
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
